name: Git Bundle Checkout
description: Seeds the Buildkite checkout from a GCS-hosted git cache tarball (fast, in-infra) instead of cloning from GitHub
author: Hivebrite
requirements:
  - gcloud
  - git
  - tar
  - timeout
configuration:
  properties:
    gcs_uri:
      type: string
    download_timeout:
      type: integer
    git_timeout:
      type: integer
  required:
    - gcs_uri
